
name: flutter_sla_task_tracker
description: "A Flutter Project and SLA Task Tracker application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # SQLite database for storing tasks and team members
  sqflite: ^2.4.4+1

  # Database file paths
  path: ^1.9.0

  # iOS-style icons
  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # SQLite support for desktop testing
  sqflite_common_ffi: ^2.3.0+4

  # Flutter code quality rules
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
