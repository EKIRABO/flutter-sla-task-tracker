
name: flutter_sla_task_tracker
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # SQLite database for storing tasks and team members
  sqflite: ^2.3.0

  # File paths for the SQLite database
  path: ^1.9.0

  # Cupertino icons
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # SQLite support for desktop testing
  sqflite_common_ffi: ^2.3.0+4

  # Recommended Flutter lint rules
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
